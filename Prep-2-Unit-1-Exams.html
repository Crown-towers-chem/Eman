let currentModel = 1;
let studentName = '';
let quiz = [];              // questions of the current attempt (after shuffling)
let wrongAnswersLog = [];
let skillStats = {};
const SKILL_ORDER = ['Vocabulary', 'Grammar', 'Reading', 'Phonics'];
const skillKeys = () => SKILL_ORDER.filter(k => skillStats[k]).concat(Object.keys(skillStats).filter(k => SKILL_ORDER.indexOf(k) < 0));

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}

window.onload = () => {
  const tabs = $('model-tabs');
  for (let i = 1; i <= 4; i++) {
    const b = document.createElement('button');
    b.className = 'tab-btn';
    b.innerText = `Module ${i}`;
    b.onclick = () => startApp(i);
    tabs.appendChild(b);
  }
  if (TEACHER_PHONE) {
    $('teacher-phone-group').style.display = 'none';
  } else {
    try { $('teacherPhone').value = localStorage.getItem('teacherPhone') || ''; } catch (e) { /* storage not available */ }
  }
};

function startApp(id) {
  const n = $('studentName');
  if (!n.value.trim()) {
    alert('Please enter your name first!\nمن فضلك اكتب اسمك يا بطل');
    n.focus();
    return;
  }
  studentName = n.value.trim();
  loadModel(id);
  showScreen('quiz-screen');
}

function updateProgress() {
  const done = document.querySelectorAll('#quiz-content input[type=radio]:checked').length;
  $('progress-bar').style.width = `${done / quiz.length * 100}%`;
}

function loadModel(id) {
  currentModel = id;
  const base = allModels[String(id)].map(x => ({
    q: x.q, a: x.a, tag: x.tag,
    options: SHUFFLE_OPTIONS ? shuffle(x.options) : x.options.slice()
  }));
  quiz = SHUFFLE_QUESTIONS ? shuffle(base) : base;

  $('model-title').innerText = `📝 Prep 2 - Unit 1 - Module ${id}`;
  $('question-counter').innerText = `${quiz.length} multiple-choice questions`;
  $('progress-bar').style.width = '0%';

  const c = $('quiz-content');
  c.innerHTML = '';
  quiz.forEach((x, i) => {
    const card = document.createElement('div');
    card.className = 'question-card';

    const readingMatch = x.tag === 'Reading' ? x.q.match(/^Read:\s*[“\"]([\s\S]*?)[”\"]\s*(.*)$/) : null;
    if (readingMatch) {
      const passage = document.createElement('div');
      passage.className = 'reading-passage';
      passage.innerText = `📖 ${readingMatch[1]}`;
      card.appendChild(passage);
      const q = document.createElement('div');
      q.className = 'reading-question';
      q.innerText = `${i + 1}. ${readingMatch[2]}`;
      card.appendChild(q);
    } else {
      const q = document.createElement('div');
      q.className = 'question-text';
      q.innerText = `${i + 1}. ${x.q}`;
      card.appendChild(q);
    }

    const g = document.createElement('div');
    g.className = 'options-grid';
    x.options.forEach(o => {
      const l = document.createElement('label');
      l.className = 'option-label';
      const r = document.createElement('input');
      r.type = 'radio';
      r.name = `q${i}`;
      r.value = o;
      r.onchange = () => {
        g.querySelectorAll('.option-label').forEach(el => el.classList.remove('selected'));
        l.classList.add('selected');
        updateProgress();
      };
      l.appendChild(r);
      l.appendChild(document.createTextNode(o));
      g.appendChild(l);
    });
    card.appendChild(g);
    c.appendChild(card);
  });
}

function submitQuiz() {
  const answered = quiz.filter((_, i) => document.querySelector(`input[name=q${i}]:checked`)).length;
  const ok = answered < quiz.length
    ? confirm(`You answered ${answered} of ${quiz.length}. Finish anyway?`)
    : confirm('Are you sure you want to finish the quiz?');
  if (ok) gradeQuiz();
}

function gradeQuiz() {
  let score = 0;
  wrongAnswersLog = [];
  skillStats = {};
  quiz.forEach((x, i) => {
    if (!skillStats[x.tag]) skillStats[x.tag] = { correct: 0, total: 0 };
    const st = skillStats[x.tag];
    st.total++;
    const sel = document.querySelector(`input[name=q${i}]:checked`);
    if (sel && sel.value === x.a) {
      score++;
      st.correct++;
    } else {
      wrongAnswersLog.push({ n: i + 1, q: x.q, user: sel ? sel.value : 'No Answer', correct: x.a, tag: x.tag });
    }
  });
  showResults(score, quiz.length);
}

function showResults(score, total) {
  showScreen('result-screen');

  const s = $('score-display');
  s.innerText = `${score}/${total}`;
  const noAnswer = wrongAnswersLog.filter(x => x.user === 'No Answer').length;
  $('result-summary').innerText = `Answered: ${total - noAnswer}/${total} | Mistakes: ${wrongAnswersLog.length}`;

  // per-skill chips
  $('skills-box').innerHTML = skillKeys().map(k => {
    const st = skillStats[k];
    const p = st.correct / st.total;
    const cls = p >= 0.8 ? 'good' : p >= 0.5 ? 'mid' : 'low';
    return `<div class="skill-chip ${cls}">${esc(k)}<small>${st.correct}/${st.total}</small></div>`;
  }).join('');

  // mistakes review
  const box = $('mistakes-section');
  if (wrongAnswersLog.length) {
    box.innerHTML = '<div class="mistakes-title" lang="ar" dir="rtl">مراجعة الأخطاء</div>' +
      wrongAnswersLog.map(x => {
        const user = x.user === 'No Answer' ? 'لم تجب' : x.user;
        return `<div class="mistake-item">
          <div class="mistake-q">${x.n}. ${esc(x.q)}</div>
          <div class="wrong-answer" lang="ar" dir="rtl">❌ إجابتك: <bdi>${esc(user)}</bdi></div>
          <div class="correct-answer" lang="ar" dir="rtl">✅ الإجابة الصحيحة: <bdi>${esc(x.correct)}</bdi></div>
        </div>`;
      }).join('');
  } else {
    box.innerHTML = '<div class="mistakes-title" lang="ar" dir="rtl" style="color:#168f62">ممتاز! لا توجد أخطاء 🎉</div>';
  }

  // encouragement (Arabic, name isolated so it never scrambles the sentence)
  const p = score / total * 100;
  const m = $('encouragement-msg');
  const nm = `<bdi>${esc(studentName)}</bdi>`;
  m.lang = 'ar'; m.dir = 'rtl';
  if (p === 100)      { s.style.background = '#2ed573'; m.innerHTML = `ممتاز يا ${nm}! 🏆`; }
  else if (p >= 80)   { s.style.background = '#1e90ff'; m.innerHTML = `رائع يا ${nm}! 💪`; }
  else if (p >= 50)   { s.style.background = '#ffa502'; m.innerHTML = `جيد يا ${nm}، راجع أخطاءك 👍`; }
  else                { s.style.background = '#ff4757'; m.innerHTML = `لا تيأس يا ${nm}، حاول مرة أخرى ❤️`; }
}

function retryModule() {
  loadModel(currentModel);
  showScreen('quiz-screen');
}

function backToModules() {
  showScreen('welcome-screen');   // the student name stays filled in
}

// ---------- WhatsApp report ----------
function normalizePhone(v) {
  let d = String(v).replace(/\D/g, '');
  if (d.indexOf('0020') === 0) d = d.slice(4);                          // 0020 1xx...
  else if (d.indexOf('20') === 0 && d.length >= 12) d = d.slice(2);     // +20 1xx...
  if (d.charAt(0) === '0') d = d.slice(1);                              // 01xx...
  return (d.length === 10 && d.charAt(0) === '1') ? '20' + d : null;
}

function getTeacherPhone() {
  const input = TEACHER_PHONE || $('teacherPhone').value;
  const phone = normalizePhone(input);
  if (!phone) {
    alert('Please enter a valid Egyptian mobile number, e.g. 01xxxxxxxxx\nمن فضلك اكتب رقم موبايل مصري صحيح');
    return null;
  }
  if (!TEACHER_PHONE) {
    try { localStorage.setItem('teacherPhone', $('teacherPhone').value.trim()); } catch (e) { /* ignore */ }
  }
  return phone;
}

// For reading questions, drop the passage and keep only the question itself
function shortQuestion(q) {
  const i = q.lastIndexOf('”');
  return (q.indexOf('Read:') === 0 && i > -1) ? q.slice(i + 1).trim() : q;
}

function sendWhatsApp() {
  const phone = getTeacherPhone();
  if (!phone) return;

  const skills = skillKeys().map(k => `${k} ${skillStats[k].correct}/${skillStats[k].total}`).join(' | ');
  let msg = `*Unit 1 Revision - Prep 2*\n--------------------\n` +
            `👤 *Student:* ${studentName}\n` +
            `📝 *Module:* ${currentModel}\n` +
            `📊 *Score:* ${$('score-display').innerText}\n` +
            `🧩 *Skills:* ${skills}\n`;

  if (wrongAnswersLog.length) {
    msg += `\n*Mistakes (${wrongAnswersLog.length}):*\n`;
    wrongAnswersLog.slice(0, MAX_MISTAKES_IN_REPORT).forEach(x => {
      msg += `• [${x.tag}] ${shortQuestion(x.q)} → ${x.user} ✗ (correct: ${x.correct})\n`;
    });
    if (wrongAnswersLog.length > MAX_MISTAKES_IN_REPORT) {
      msg += `… and ${wrongAnswersLog.length - MAX_MISTAKES_IN_REPORT} more\n`;
    }
  } else {
    msg += '🎉 *Perfect score!*';
  }

  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
}

</script>
